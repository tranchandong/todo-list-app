- name: Deploy MERN Todo app
  hosts: myhosts
  become: true

  vars:
    app_dir: /opt/todo-app
    app_repo: https://github.com/tranchandong/todo-list-app.git

  tasks:
    - name: Install Git
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Clone application repository
      become: false
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: main
        update: true

    - name: Copy backend environment file
      ansible.builtin.copy:
        src: files/backend.env
        dest: "{{ app_dir }}/backend/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true

    - name: Ensure MongoDB volume exists
      ansible.builtin.command:
        cmd: docker volume create todo-mongo-data
      changed_when: false
    - name: Build and start MERN services
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ app_dir }}"
      register: compose_result
      changed_when: true

    - name: Wait for frontend to respond
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/
        status_code: 200
      register: frontend_result
      until: frontend_result.status == 200
      retries: 12
      delay: 5
