services:
  todo-mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  todo-backend:
    image: tranchandong/todo-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "8000"
      MONGO_URI: mongodb://todo-mongo:27017/todoapp
    depends_on:
      todo-mongo:
        condition: service_healthy

  todo-frontend:
    image: tranchandong/todo-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - todo-backend

volumes:
  mongo-data:
    external: true
    name: todo-mongo-data
